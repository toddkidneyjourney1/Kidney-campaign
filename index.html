<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANTED: A KIDNEY | A New Chapter</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div style="text-align: center; padding: 20px;">
        <button onclick="toggleLanguage()" style="padding: 10px 20px; cursor: pointer;">Switch to Español / Switch to English</button>
    </div>

    <div id="english-content">
        </div>

    <div id="div-spanish-content" style="display:none; padding: 20px; max-width: 1100px; margin: 0 auto;">
        </div>

    <script>
        function toggleLanguage() {
            var eng = document.getElementById("english-content");
            var spa = document.getElementById("div-spanish-content");
            eng.style.display = (eng.style.display === "none") ? "block" : "none";
            spa.style.display = (spa.style.display === "none") ? "block" : "none";
        }
    </script>
</body>
</html>
